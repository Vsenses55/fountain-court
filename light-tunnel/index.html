<!DOCTYPE html>
<html lang="en">
<head>

<title>Light Tunnel — Light Show Series</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1820'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23b98cff' stroke-width='5' stroke-dasharray='2 5'/%3E%3C/svg%3E" />

<style>
  :root {
    --glass: rgba(18, 16, 30, 0.55);
    --line: rgba(255, 255, 255, 0.12);
    --text: #ece9ff;
    --dim: rgba(236, 233, 255, 0.55);
    --accent: #b98cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a1820; overflow: hidden; color: var(--text);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .title { position: fixed; top: calc(22px + env(safe-area-inset-top)); left: 26px; user-select: none; }
  .title h1 { margin: 0; font-size: 13px; letter-spacing: 0.38em; font-weight: 600; pointer-events: none; }
  .title p { margin: 6px 0 0; font-size: 11px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; pointer-events: none; }
  .series { display: flex; gap: 6px; margin-top: 12px; }
  .series a, .series span { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none;
    color: var(--dim); padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .series a:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  .fade { position: fixed; inset: 0; background: #1a1820; opacity: 0; pointer-events: none; transition: opacity .45s; z-index: 20; }
  .fade.on { opacity: 1; }
  .nogl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: #1a1820; z-index: 30;
    font-size: 12px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; line-height: 1.8; }
  .series span { color: #fff; border-color: rgba(185, 140, 255, 0.55); background: rgba(185, 140, 255, 0.18); }

  .now { position: fixed; top: calc(22px + env(safe-area-inset-top)); right: 26px; text-align: right; pointer-events: none; user-select: none; }
  .now .label { font-size: 10px; letter-spacing: 0.24em; color: var(--dim); text-transform: uppercase; }
  .now .name { font-size: 15px; margin-top: 4px; font-weight: 500; letter-spacing: 0.04em; }
  .now .bar { width: 140px; height: 2px; background: var(--line); margin: 8px 0 0 auto; border-radius: 2px; overflow: hidden; }
  .now .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4f8bff, #b46bff, #ff5fc4, #3dffa8); }
  .now .dist { font-size: 10px; letter-spacing: 0.2em; color: var(--dim); margin-top: 10px; font-variant-numeric: tabular-nums; }

  .dock { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .group { display: flex; gap: 2px; padding: 0 4px; border-right: 1px solid var(--line); }
  .group:last-child { border-right: 0; }
  .dock button, .dock select {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 12px; letter-spacing: 0.02em; padding: 8px 11px; border-radius: 10px; cursor: pointer;
    white-space: nowrap; transition: background .2s, color .2s; }
  .dock select { padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 13px) 52%, calc(100% - 9px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
  .dock select option { background: #15131f; color: var(--text); }
  .dock button:hover, .dock select:hover { background: rgba(255,255,255,0.07); }
  .dock button.on { background: rgba(185, 140, 255, 0.2); color: #fff; }
  .dock .tag { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; align-self: center; padding: 0 4px 0 6px; }

  .hint { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; pointer-events: none;
    transition: opacity 1.2s; white-space: nowrap; }

  .loader { position: fixed; inset: 0; display: grid; place-items: center; background: #1a1820; z-index: 10; transition: opacity .8s; }
  .loader span { font-size: 11px; letter-spacing: 0.3em; color: var(--dim); }

  @media (max-width: 640px) {
    .title { top: calc(16px + env(safe-area-inset-top)); left: 16px; }
    .now { top: calc(16px + env(safe-area-inset-top)); right: 16px; }
    .now .bar { width: 100px; }
    .dock .tag { display: none; }
    .hint { font-size: 10px; }
  }
</style>

<body>
<div class="loader" id="loader"><span>STRINGING THE LIGHTS…</span></div>

<div class="title">
  <h1>LIGHT TUNNEL</h1>
  <p>Light show series · No. 2</p>
  <div class="series">
    <a href="../">01 Fountain Court</a>
    <span>02 Light Tunnel</span>
  </div>
</div>

<div class="now">
  <div class="label">Now playing</div>
  <div class="name" id="seqName">—</div>
  <div class="bar"><i id="seqBar"></i></div>
</div>

<div class="hint" id="hint">Drag to look around · Scroll, W / S or ↑ / ↓ to change speed · Space to stop</div>

<div class="dock">
  <div class="group">
    <span class="tag">Show</span>
    <select id="seqSelect" aria-label="Sequence"></select>
    <button id="loopBtn" title="Repeat the current show instead of moving on">Loop</button>
  </div>
  <div class="group">
    <span class="tag">Light</span>
    <select id="palSelect" aria-label="Palette"></select>
  </div>
  <div class="group">
    <span class="tag">Speed</span>
    <button data-pace="0">Stop</button>
    <button data-pace="0.7">Slow</button>
    <button data-pace="1.35" class="on">Medium</button>
    <button data-pace="3.2">Fast</button>
  </div>
  <div class="group">
    <span class="tag">View</span>
    <button data-view="inside" class="on">Inside</button>
    <button data-view="afar">Afar</button>
  </div>
  <div class="group">
    <span class="tag">Route</span>
    <button data-route="straight">Straight</button>
    <button data-route="winding" class="on">Winding</button>
  </div>
  <div class="group">
    <button id="mistBtn" class="on" title="Fog / haze">Mist</button>
    <button id="soundBtn" title="Ambient sound">Sound</button>
  </div>
</div>


<div class="fade" id="fade"></div>
<script>
  // soft fade between the shows in the series
  document.querySelectorAll('.series a').forEach(a => a.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); document.getElementById('fade').classList.add('on');
    setTimeout(() => { location.href = a.href; }, 420);
  }));
  addEventListener('pageshow', () => document.getElementById('fade').classList.remove('on'));
  // friendly message when WebGL isn't available
  (() => { const c = document.createElement('canvas');
    if (!(c.getContext('webgl2') || c.getContext('webgl'))) {
      const d = document.createElement('div'); d.className = 'nogl';
      d.innerHTML = 'This light show needs WebGL.<br>Try a current version of Chrome, Safari, Edge or Firefox.';
      document.body.appendChild(d); } })();
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ---------------------------------------------------------------------------
// Quality tier
// ---------------------------------------------------------------------------
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;
const Q = isMobile
  ? { dpr: Math.min(devicePixelRatio, 1.5), arches: 70, rows: 1, refl: 0.4, mist: 60 }
  : { dpr: Math.min(devicePixelRatio, 2), arches: 92, rows: 1, refl: 0.55, mist: 110 };

// ---------------------------------------------------------------------------
// Tunnel geometry (metres)
// ---------------------------------------------------------------------------
const SP = 0.75;                // spacing between arches
const N_ARCH = Q.arches;
const L = N_ARCH * SP;          // loop length — arches recycle from behind you to the far end
const NEAR = 4.0;               // how far behind the camera an arch lives before it recycles
const R = 2.9;                  // arch radius (= half width)
const LEG_H = 1.25;             // straight leg height before the curve starts
const FOOT = 0.12;              // lowest LED above the ground
const DOT = 0.122;              // LED pitch along the arch
const ROW_GAP = 0.13;           // gap between the parallel LED rows on one arch
const EYE = 1.62;

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 260);
camera.position.set(0, EYE, 0);
camera.rotation.order = 'YXZ';

// Backdrop: same charcoal gradient as the PXL viewer / Fountain Court
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#1d1b23'); g.addColorStop(0.55, '#2c2934'); g.addColorStop(1, '#0f0e13');
  x.fillStyle = g; x.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

// ---------------------------------------------------------------------------
// Palettes (index 0 is sampled from the reference video)
// ---------------------------------------------------------------------------
const PALETTES = {
  'Tunnel':         ['#3a3cff', '#8a3dff', '#2dff8a', '#14e0b0', '#ff2a55', '#c2186b', '#18c8ff', '#7bff4a'],
  'Fountain Court': ['#2a6bff', '#18c8ff', '#7b46ff', '#c03dff', '#ff3fae', '#ff6fd0', '#2dffa0', '#14d7c4'],
  'Ocean':          ['#0a3dff', '#1a8bff', '#18d6ff', '#1ef0d0', '#3a5bff'],
  'Aurora':         ['#2dffa0', '#14d7c4', '#7b46ff', '#b04dff', '#2dff6a'],
  'Candy':          ['#ff3fae', '#ff7ad9', '#b04dff', '#ff4f8a'],
  'Ember':          ['#ff2a2a', '#ff6a1a', '#ff2d6f', '#c2186b', '#ffb02e'],
};
const palCols = {};
for (const k in PALETTES) palCols[k] = PALETTES[k].map(h => new THREE.Color(h));
let paletteName = 'Tunnel';
const palUniform = { value: Array.from({ length: 8 }, () => new THREE.Color()) };
const palN = { value: 8 };
function applyPalette() {
  const cols = palCols[paletteName];
  palN.value = cols.length;
  palUniform.value.forEach((c, i) => c.copy(cols[i % cols.length]));
}
applyPalette();
function samplePalette(u, out) {
  const cols = palCols[paletteName], n = cols.length;
  u = ((u % 1) + 1) % 1 * n; const i = Math.floor(u), f = u - i, s = f * f * (3 - 2 * f);
  return out.copy(cols[i]).lerp(cols[(i + 1) % n], s);
}

// ---------------------------------------------------------------------------
// Shows — shared GLSL so the LEDs, the mist and the floor all agree on colour.
//   k   = arch number along the tunnel (grows with distance, pinned to the world)
//   u   = position around the arch, 0 = left foot, 0.5 = apex, 1 = right foot
//   rnd = per-LED random
// Returns rgb (colour) and a (intensity).
// ---------------------------------------------------------------------------
const SHOWS = [
  'Color Wash', 'Chase', 'Arc Sweep', 'Spiral', 'Twinkle', 'Heartbeat', 'Split', 'Rainbow Road'
];
const SHOW_DUR = 15, XFADE = 2.2;

const SHOW_GLSL = `
  uniform vec3 uPal[8]; uniform float uPalN;
  uniform int uShowA, uShowB; uniform float uTA, uTB, uMix;
  float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
  vec3 pal(float h){
    h = fract(h) * uPalN; float i = floor(h), f = h - i; f = f * f * (3.0 - 2.0 * f);
    int a = int(i); int b = int(mod(i + 1.0, uPalN));
    return mix(uPal[a], uPal[b], f);
  }
  float pulse(float x, float w){ x = fract(x); return pow(max(0.0, 1.0 - abs(x - 0.5) / w), 1.5); }

  vec4 show(int id, float t, float k, float u, float rnd){
    float side = abs(u - 0.5) * 2.0;          // 0 at the apex, 1 at the feet
    if (id == 0) {                            // Color Wash — whole tunnel drifts through the palette
      vec3 c = pal(t * 0.045 + k * 0.012);
      return vec4(c, 0.8 + 0.2 * sin(t * 1.3 - k * 0.25));
    }
    if (id == 1) {                            // Chase — bright rings racing away from you
      float x = k * 0.07 - t * 0.55;
      float p = pulse(x, 0.22);
      vec3 c = pal(floor(x) * 0.27 + 0.1);
      return vec4(mix(c, vec3(1.0), p * 0.2), 0.1 + 1.2 * p);
    }
    if (id == 2) {                            // Arc Sweep — colour climbs from the feet to the apex
      float tt = t * 0.32 - k * 0.018;
      float ph = fract(tt), cyc = floor(tt);
      float front = 1.0 - ph * 1.2;
      float on = smoothstep(front - 0.08, front, side);
      vec3 c = mix(pal((cyc - 1.0) * 0.31 + 0.2), pal(cyc * 0.31 + 0.2), on);
      float edge = exp(-pow((side - front) * 14.0, 2.0));
      return vec4(mix(c, vec3(1.0), edge * 0.5), 0.55 + 0.45 * on + edge * 0.8);
    }
    if (id == 3) {                            // Spiral — stripes corkscrew down the tunnel
      float p = pulse(u * 2.0 + k * 0.09 - t * 0.45, 0.24);
      vec3 c = pal(u * 0.5 + k * 0.02 + t * 0.03);
      return vec4(c, 0.08 + 1.15 * p);
    }
    if (id == 4) {                            // Twinkle — soft wash with sparkling LEDs
      vec3 c = pal(t * 0.03 + k * 0.01 + 0.6);
      float slot = floor(t * 5.0 + rnd * 17.0);
      float s = smoothstep(0.92, 1.0, h11(rnd * 917.0 + slot * 13.7));
      s *= 1.0 - fract(t * 5.0 + rnd * 17.0);
      return vec4(mix(c, vec3(1.0), s * 0.85), 0.3 + s * 1.9);
    }
    if (id == 5) {                            // Heartbeat — double pulses rushing toward you
      float x = k * 0.045 + t * 0.5;
      float p = pulse(x, 0.1) + 0.65 * pulse(x - 0.07, 0.07);
      vec3 c = pal(floor(x) * 0.37 + 0.55);
      return vec4(c, 0.1 + 1.25 * p);
    }
    if (id == 6) {                            // Split — two colours meeting at the apex
      float m = smoothstep(0.38, 0.62, u + 0.14 * sin(t * 0.8 + k * 0.15));
      vec3 a = pal(t * 0.04), b = pal(t * 0.04 + 0.45);
      return vec4(mix(a, b, m), 0.9);
    }
    // 7 Rainbow Road — every arch its own colour, scrolling past
    vec3 c = pal(k * 0.085 - t * 0.12);
    return vec4(c, 0.75 + 0.25 * sin(k * 1.7 + t * 3.0));
  }
  vec3 lightAt(float k, float u, float rnd){
    float kd = k * ${(SP / 1.5).toFixed(3)};
    vec4 a = show(uShowA, uTA, kd, u, rnd);
    vec4 b = show(uShowB, uTB, kd, u, rnd);
    return mix(a.rgb * a.a, b.rgb * b.a, uMix);
  }
`;

const shared = {
  uPal: palUniform, uPalN: palN,
  uShowA: { value: 0 }, uShowB: { value: 0 }, uTA: { value: 0 }, uTB: { value: 0 }, uMix: { value: 1 },
  uTravel: { value: 0 }, uScale: { value: 1 }, uTime: { value: 0 },
  uCamS: { value: 0 }, uBend: { value: 1 }, uNear: { value: NEAR }, uBackW: { value: 0.5 },
};

// Winding route: the centreline drifts side to side as a sum of slow sines.
// The camera stays put in three.js; the tunnel is bent around it so you always face along the curve.
const PATH_GLSL = `
  uniform float uCamS, uBend;
  float pX(float S){ return uBend * (4.0 * sin(S * 0.045) + 1.8 * sin(S * 0.11 + 1.3)); }
  float pXd(float S){ return uBend * (0.18 * cos(S * 0.045) + 0.198 * cos(S * 0.11 + 1.3)); }
  // camera-frame position of an arch point (lx across, ly up) that sits d metres ahead
  vec3 pathPos(float d, float lx, float ly){
    float S = uCamS + d;
    vec2 f = normalize(vec2(pXd(S), -1.0)), r = vec2(-f.y, f.x);
    vec2 w = vec2(pX(S), -d) + r * lx;
    vec2 cc = vec2(pX(uCamS), 0.0), fc = normalize(vec2(pXd(uCamS), -1.0)), rc = vec2(-fc.y, fc.x);
    vec2 q = w - cc;
    return vec3(dot(q, rc), ly, -dot(q, fc));
  }
`;
const pX = S => 4 * Math.sin(S * 0.045) + 1.8 * Math.sin(S * 0.11 + 1.3);
const pXdd = S => -4 * 0.045 * 0.045 * Math.sin(S * 0.045) - 1.8 * 0.11 * 0.11 * Math.sin(S * 0.11 + 1.3);

// GLSL that recycles a z position so the tunnel never ends
const WRAP_GLSL = `
  uniform float uTravel, uNear, uBackW;
  // the window of tunnel that exists runs from uNear (behind) to uNear - L (far ahead);
  // moving uNear changes which copy of an arch is drawn, never where an arch is
  float wrapZ(float baseZ){ return mod(baseZ + uTravel - uNear, ${L.toFixed(3)}) + uNear - ${L.toFixed(3)}; }
  // fade at both ends of the window: far ahead into the haze, and behind (only visible from the far view)
  float endFade(float z, float farW){
    float far = -z, farEnd = ${L.toFixed(3)} - uNear;
    return (1.0 - smoothstep(farEnd - farW, farEnd - 2.0, far)) * (1.0 - smoothstep(uNear - uBackW, uNear, z));
  }
  float archK(float z){ return floor(-(z - uTravel) / ${SP.toFixed(3)} + 0.5); }
` + PATH_GLSL;

// ---------------------------------------------------------------------------
// LED arches — one Points cloud, everything animated in the shader
// ---------------------------------------------------------------------------
{
  const legLen = LEG_H - FOOT, arcLen = Math.PI * R, P = legLen * 2 + arcLen;
  const nDots = Math.floor(P / DOT);
  const pts = [], prm = [];
  const pointOnPath = s => {
    if (s < legLen) return [-R, FOOT + s];
    if (s < legLen + arcLen) { const a = Math.PI - (s - legLen) / R; return [Math.cos(a) * R, LEG_H + Math.sin(a) * R]; }
    return [R, LEG_H - (s - legLen - arcLen)];
  };
  for (let a = 0; a < N_ARCH; a++) for (let r = 0; r < Q.rows; r++) for (let i = 0; i < nDots; i++) {
    const s = Math.min(P - 0.01, (i + 0.5 + (r % 2) * 0.5) * (P / nDots));
    const [x, y] = pointOnPath(s);
    const baseZ = -a * SP - r * ROW_GAP;
    pts.push(x, y, baseZ);
    prm.push(s / P, r, Math.random(), 0);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  geo.setAttribute('prm', new THREE.Float32BufferAttribute(prm, 4));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 2, -L / 2), L);

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: shared,
    vertexShader: `
      ${WRAP_GLSL}
      ${SHOW_GLSL}
      uniform float uScale;
      attribute vec4 prm;
      varying vec3 vC; varying float vA; varying float vHalf, vBulb, vGlow;
      void main(){
        vec3 p = position; p.z = wrapZ(position.z);
        float k = archK(p.z);
        vec3 c = lightAt(k, prm.x, prm.z);
        vec4 mv = modelViewMatrix * vec4(pathPos(-p.z, p.x, p.y), 1.0);
        gl_Position = projectionMatrix * mv;
        float dist = -mv.z;
        float ppm = uScale / max(dist, 0.05);          // pixels per metre at this LED
        float size = 0.1 * ppm;
        // up close: a small, hard-edged bulb with a tight glow capped in pixels, so near LEDs stay crisp
        float bulb = 0.019 * ppm;
        float glow = min(0.022 * ppm, 5.0) + 1.0;
        float crispSize = 2.0 * (bulb + glow * 2.2);
        float crisp = 1.0;   // sharp bulb + short glow at every distance
        float ps = mix(size, crispSize, crisp);
        // far away: fade sub-pixel LEDs instead of letting them shimmer
        vA = clamp(size / 1.6, 0.0, 1.0);
        gl_PointSize = max(ps, 1.6);
        vHalf = max(ps, 1.6) * 0.5; vBulb = bulb; vGlow = glow * crisp;
        float far = max(-p.z, 0.0);
        vA *= endFade(p.z, 22.0) * exp(-far * 0.02);
        vA *= 0.9 + 0.2 * prm.z;              // slight per-bulb variation
        vC = c * 1.35;
      }`,
    fragmentShader: `
      varying vec3 vC; varying float vA; varying float vHalf, vBulb, vGlow;
      void main(){
        vec2 c = gl_PointCoord - 0.5; float d = dot(c, c) * 4.0;
        if (d > 1.0) discard;
        // soft profile (distance)
        float halo = exp(-d * 3.0), core = exp(-d * 14.0);
        vec3 soft = vC * halo + vec3(dot(vC, vec3(0.33))) * core * 0.9;
        // crisp profile (close): anti-aliased disc + short glow
        float rpx = sqrt(d) * vHalf;
        float disc = 1.0 - smoothstep(vBulb - 0.8, vBulb + 0.8, rpx);
        float g = exp(-max(rpx - vBulb, 0.0) / max(vGlow * 0.45, 0.001)) * 0.55;
        vec3 hot = mix(vC, vec3(max(vC.r, max(vC.g, vC.b))), 0.45);   // bulb centre runs a little whiter
        vec3 crisp = vC * g + hot * disc * 1.5;
        vec3 col = crisp;
        gl_FragColor = vec4(col, vA);
      }`
  });
  const leds = new THREE.Points(geo, mat);
  leds.frustumCulled = false;
  scene.add(leds);

  // Arch frames: thin dark tubes the LEDs are strung on (reads as structure when the lights dip)
  const tubeGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(
    Array.from({ length: 40 }, (_, i) => { const [x, y] = pointOnPath(i / 39 * P); return new THREE.Vector3(x * 1.012, y, 0); })
  ), 60, 0.012, 5, false);
  tubeGeo.translate(0, 0, -ROW_GAP * (Q.rows - 1) / 2);
  const offs = new Float32Array(N_ARCH);
  for (let a = 0; a < N_ARCH; a++) offs[a] = -a * SP;
  const frameMat = new THREE.ShaderMaterial({
    uniforms: shared,
    vertexShader: `
      ${WRAP_GLSL}
      attribute float off;
      varying float vF;
      void main(){
        vec3 p = position; p.z += wrapZ(off);
        vec4 mv = modelViewMatrix * vec4(pathPos(-p.z, p.x, p.y), 1.0);
        vF = endFade(p.z, 30.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `varying float vF; void main(){ gl_FragColor = vec4(vec3(0.035, 0.033, 0.045), vF); }`,
    transparent: true,
  });
  const frames = new THREE.InstancedMesh(tubeGeo, frameMat, N_ARCH);
  frames.geometry.setAttribute('off', new THREE.InstancedBufferAttribute(offs, 1));
  // identity matrices; the shader places each frame
  const m = new THREE.Matrix4();
  for (let a = 0; a < N_ARCH; a++) frames.setMatrixAt(a, m.identity());
  frames.frustumCulled = false;
  // InstancedMesh multiplies by instanceMatrix only when the shader includes it; ours doesn't, so offsets come from `off`.
  scene.add(frames);
}

// ---------------------------------------------------------------------------
// Wet path — reflects the arches; puddles and gravel scroll by as you walk
// ---------------------------------------------------------------------------
const FloorShader = {
  name: 'WetPath',
  uniforms: {
    color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null },
    uTravel: shared.uTravel, uTime: shared.uTime, uCamS: shared.uCamS, uBend: shared.uBend, uNear: shared.uNear, uBackW: shared.uBackW, uGlow: { value: new THREE.Color() },
  },
  vertexShader: `
    uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vW;
    void main(){ vUv = textureMatrix * vec4(position, 1.0); vW = (modelMatrix * vec4(position,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTravel, uTime, uNear, uBackW; uniform vec3 uGlow;
    ${PATH_GLSL}
    varying vec4 vUv; varying vec3 vW;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
    void main(){
      // undo the bend: find where on the route this bit of floor is, and how far from the centreline
      vec2 cc = vec2(pX(uCamS), 0.0), fc = normalize(vec2(pXd(uCamS), -1.0)), rc = vec2(-fc.y, fc.x);
      vec2 w = cc + rc * vW.x - fc * vW.z;
      float far = -w.y, S = uCamS + far;
      float lat = (w.x - pX(S)) / sqrt(1.0 + pXd(S) * pXd(S));
      vec2 q = vec2(lat, -S);                      // ground coordinates pinned to the world

      // puddles: patches of standing water read as mirrors, the rest is damp packed earth
      float n = noise(q * vec2(0.42, 0.22)) * 0.7 + noise(q * 1.1 + 7.0) * 0.3;
      float puddle = smoothstep(0.5, 0.62, n);
      float grit = noise(q * 38.0) * 0.6 + noise(q * 90.0) * 0.4;

      vec2 slope = (vec2(noise(q * 2.5 + uTime * 0.05), noise(q * 2.5 + 3.0 - uTime * 0.04)) - 0.5) * mix(0.25, 0.015, puddle);
      vec3 n3 = normalize(vec3(-slope.x, 1.0, -slope.y));
      vec3 V = normalize(cameraPosition - vW);
      float F = 0.02 + 0.98 * pow(1.0 - clamp(dot(n3, V), 0.0, 1.0), 5.0);

      vec2 ruv = vUv.xy / vUv.w + slope * 0.06;
      float blur = mix(0.012, 0.0015, puddle);
      vec3 refl = texture2D(tDiffuse, ruv).rgb * 0.36;
      refl += texture2D(tDiffuse, ruv + vec2(0.0,  blur)).rgb * 0.16;
      refl += texture2D(tDiffuse, ruv + vec2(0.0, -blur)).rgb * 0.16;
      refl += texture2D(tDiffuse, ruv + vec2( blur * 0.4, blur * 2.0)).rgb * 0.16;
      refl += texture2D(tDiffuse, ruv + vec2(-blur * 0.4, -blur * 2.0)).rgb * 0.16;
      float reflK = mix(0.12 + 0.35 * F, 0.25 + 0.75 * F, puddle);

      vec3 base = vec3(0.014, 0.013, 0.017) * (0.7 + grit * 0.6) * (1.0 - puddle * 0.5);
      // light spilling onto the path from the arch legs, and a soft wash across the middle
      float legs = exp(-pow(abs(lat) - ${R.toFixed(2)}, 2.0) * 1.6);
      vec3 col = base + refl * reflK + uGlow * (legs * 0.08 + 0.012) * (0.6 + grit * 0.5);

      float farEnd = ${L.toFixed(3)} - uNear;
      float alpha = (1.0 - smoothstep(farEnd - 26.0, farEnd - 4.0, far)) * (1.0 - smoothstep(uNear - 1.0 - uBackW, uNear - 1.0, -far))
                  * (1.0 - smoothstep(${(R + 0.3).toFixed(2)}, ${(R + 1.8).toFixed(2)}, abs(lat)));
      gl_FragColor = vec4(col, alpha);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
};
const floor = new Reflector(new THREE.PlaneGeometry(90, L + 44), {
  shader: FloorShader,
  textureWidth: Math.floor(innerWidth * Q.dpr * Q.refl),
  textureHeight: Math.floor(innerHeight * Q.dpr * Q.refl),
  multisample: isMobile ? 0 : 4,
  clipBias: 0.002,
});
floor.rotation.x = -Math.PI / 2;
floor.position.z = 38 - (L + 44) / 2;
floor.material.transparent = true;
floor.renderOrder = -1;
const floorU = floor.material.uniforms;
floorU.uTravel = shared.uTravel; floorU.uTime = shared.uTime; floorU.uNear = shared.uNear; floorU.uBackW = shared.uBackW;
scene.add(floor);

// ---------------------------------------------------------------------------
// Haze — low drifting clouds lit by the arches around them
// ---------------------------------------------------------------------------
const MM = Q.mist;
const mistMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: Object.assign({ uOn: { value: 1 }, uView: { value: 0 } }, shared),
  vertexShader: `
    ${WRAP_GLSL}
    ${SHOW_GLSL}
    uniform float uScale, uTime, uOn, uView;
    attribute vec4 prm;
    varying vec3 vC; varying float vA; varying float vR;
    void main(){
      vec3 p = position;
      p.x += sin(uTime * 0.07 + prm.z * 30.0) * 0.6;
      p.y += sin(uTime * 0.05 + prm.z * 11.0) * 0.15;
      p.z = wrapZ(position.z + uTime * 0.12 * (prm.z - 0.5));
      float k = archK(p.z);
      // average of the light on both sides and the crown of the nearest arch
      vec3 c = (lightAt(k, 0.08, 0.5) + lightAt(k, 0.5, 0.5) + lightAt(k, 0.92, 0.5)) / 3.0;
      vec4 mv = modelViewMatrix * vec4(pathPos(-p.z, p.x, p.y), 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = min(prm.y * uScale / -mv.z, 1100.0);
      vC = c + 0.06;
      float far = -p.z;
      vA = 0.05 * uOn * exp(-max(far, 0.0) * 0.045 * (1.0 - uView * 0.7)) * smoothstep(0.8, 3.0, -mv.z) * endFade(p.z, 24.0);
      vR = prm.z * 6.28;
    }`,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vC; varying float vA; varying float vR;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    void main(){
      vec2 c = gl_PointCoord - 0.5; float cs = cos(vR), sn = sin(vR); c = mat2(cs,-sn,sn,cs) * c;
      float d = length(c) * 2.0; if (d > 1.0) discard;
      float n = noise(c * 4.0 + vR * 10.0 + uTime * 0.12) * 0.6 + noise(c * 9.0 - uTime * 0.17) * 0.4;
      gl_FragColor = vec4(vC, vA * smoothstep(1.0, 0.1, d) * (0.4 + 0.8 * n));
    }`
});
{
  const pos = new Float32Array(MM * 3), prm = new Float32Array(MM * 4);
  for (let i = 0; i < MM; i++) {
    pos[i * 3] = (Math.random() - 0.5) * R * 1.8;
    pos[i * 3 + 1] = 0.2 + Math.random() * Math.random() * 1.6;
    pos[i * 3 + 2] = -Math.random() * L;
    prm[i * 4 + 1] = 2.2 + Math.random() * 2.8;   // world size
    prm[i * 4 + 2] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('prm', new THREE.BufferAttribute(prm, 4));
  const mist = new THREE.Points(g, mistMat);
  mist.frustumCulled = false;
  mist.renderOrder = 2;
  scene.add(mist);
}

// ---------------------------------------------------------------------------
// Show timeline
// ---------------------------------------------------------------------------
const seqSelect = document.getElementById('seqSelect');
SHOWS.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s; seqSelect.appendChild(o); });
const palSelect = document.getElementById('palSelect');
Object.keys(PALETTES).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k; palSelect.appendChild(o); });

const show = { idx: 0, prev: 0, t: 0, prevT: 0, blend: 1, loop: false };
function startShow(i) {
  show.prev = show.idx; show.prevT = show.t; show.idx = i; show.t = 0; show.blend = 0;
  document.getElementById('seqName').textContent = SHOWS[i];
  seqSelect.value = String(i);
  if (audio) setChord(i);
}

// ---------------------------------------------------------------------------
// Walking + looking
// ---------------------------------------------------------------------------
const walk = { pace: 1.35, speed: 0, travel: 0, step: 0, lastStep: 0, boost: 0 };
const look = { yaw: 0, pitch: 0.04, tYaw: 0, tPitch: 0.04, lastInput: -10 };
const CHASE = { az: 0, el: 0.2 };
const orbit = { az: CHASE.az, el: CHASE.el, tAz: CHASE.az, tEl: CHASE.el, dist: 14, lastInput: -10 };
let drag = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: look.tYaw, pitch: look.tPitch, az: orbit.tAz, elv: orbit.tEl }; el.setPointerCapture(e.pointerId); hideHint(); });
el.addEventListener('pointermove', e => {
  if (!drag) return;
  const s = 2.4 / Math.min(innerWidth, innerHeight);
  if (viewAfar) {
    orbit.tAz = THREE.MathUtils.clamp(drag.az - (e.clientX - drag.x) * s * 0.6, -0.4, 0.4);
    orbit.tEl = THREE.MathUtils.clamp(drag.elv + (e.clientY - drag.y) * s * 0.6, 0.12, 0.75);
    orbit.lastInput = clock.elapsedTime;
    return;
  }
  look.tYaw = THREE.MathUtils.clamp(drag.yaw + (e.clientX - drag.x) * s, -1.05, 1.05);
  look.tPitch = THREE.MathUtils.clamp(drag.pitch + (e.clientY - drag.y) * s, -0.35, 1.15);
  look.lastInput = clock.elapsedTime;
});
const endDrag = () => { drag = null; look.lastInput = orbit.lastInput = clock.elapsedTime; };
el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);

const PACES = [0, 0.7, 1.35, 3.2];
function setPace(v) {
  walk.pace = v;
  document.querySelectorAll('[data-pace]').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.pace - v) < 0.01));
}
document.querySelectorAll('[data-pace]').forEach(b => b.addEventListener('click', () => setPace(+b.dataset.pace)));
addEventListener('wheel', e => {
  // scroll nudges the pace; it can also walk you backwards a little
  walk.pace = THREE.MathUtils.clamp(walk.pace - e.deltaY * 0.002, -1.2, 4);
  document.querySelectorAll('[data-pace]').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.pace - walk.pace) < 0.06));
  hideHint();
}, { passive: true });
const keys = {};
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); setPace(walk.pace === 0 ? 1.35 : 0); }
  hideHint();
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------------------------------------------------------------------------
// UI wiring
// ---------------------------------------------------------------------------
seqSelect.addEventListener('change', () => { startShow(+seqSelect.value); seqSelect.blur(); });
const loopBtn = document.getElementById('loopBtn');
loopBtn.addEventListener('click', () => { show.loop = !show.loop; loopBtn.classList.toggle('on', show.loop); });
palSelect.addEventListener('change', () => { paletteName = palSelect.value; applyPalette(); palSelect.blur(); });
let routeWinding = true;
let viewAfar = false;
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  viewAfar = b.dataset.view === 'afar';
  document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
  look.lastInput = -10; orbit.lastInput = -10;
}));
document.querySelectorAll('[data-route]').forEach(b => b.addEventListener('click', () => {
  routeWinding = b.dataset.route === 'winding';
  document.querySelectorAll('[data-route]').forEach(x => x.classList.toggle('on', x === b));
}));
let mistOn = true;
const mistBtn = document.getElementById('mistBtn');
mistBtn.addEventListener('click', () => { mistOn = !mistOn; mistBtn.classList.toggle('on', mistOn); });
const hintEl = document.getElementById('hint');
let hintHidden = false;
function hideHint() { if (!hintHidden) { hintHidden = true; hintEl.style.opacity = 0; } }
setTimeout(hideHint, 10000);

// ---------------------------------------------------------------------------
// Sound — a soft synth pad that changes chord with each show
// ---------------------------------------------------------------------------
let audio = null;
const CHORDS = [
  [220.0, 277.18, 329.63, 415.30], [196.0, 246.94, 293.66, 369.99], [174.61, 220.0, 261.63, 329.63],
  [207.65, 261.63, 311.13, 392.0], [233.08, 293.66, 349.23, 440.0], [164.81, 207.65, 246.94, 311.13],
  [185.0, 233.08, 277.18, 349.23], [196.0, 246.94, 329.63, 392.0],
];
function setChord(i) {
  const c = CHORDS[i % CHORDS.length], now = audio.ctx.currentTime;
  audio.oscs.forEach((o, j) => o.frequency.setTargetAtTime(c[j % c.length] * (j >= 4 ? 0.5 : 1), now, 0.8));
}
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  try {
    if (!audio) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.6;
      const padGain = ctx.createGain(); padGain.gain.value = 0;
      lp.connect(padGain).connect(master);
      const oscs = [];
      for (let j = 0; j < 6; j++) {
        const o = ctx.createOscillator(); o.type = j % 2 ? 'triangle' : 'sine';
        o.detune.value = (j - 2.5) * 5;
        const g = ctx.createGain(); g.gain.value = 0.05;
        o.connect(g).connect(lp); o.start(); oscs.push(o);
      }
      audio = { ctx, master, lp, padGain, oscs, on: true };
      setChord(show.idx);
      padGain.gain.setTargetAtTime(0.5, ctx.currentTime, 1.2);
    } else {
      audio.on = !audio.on;
      if (audio.on) { audio.ctx.resume(); audio.padGain.gain.setTargetAtTime(0.5, audio.ctx.currentTime, 0.6); }
      else audio.padGain.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.3);
    }
    soundBtn.classList.toggle('on', audio.on);
  } catch (err) { console.warn('Audio unavailable', err); }
});

// ---------------------------------------------------------------------------
// Post-processing (same chain as Fountain Court)
// ---------------------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Q.dpr);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.18, 0.5);
composer.addPass(bloom);
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; varying vec2 vUv;
    float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float n = ign(gl_FragCoord.xy) + ign(gl_FragCoord.xy + vec2(47.0, 113.0)) - 1.0;
      c.rgb += n / 255.0;
      gl_FragColor = c;
    }`
}));

function syncScale() {
  const h = renderer.getDrawingBufferSize(new THREE.Vector2()).y;
  shared.uScale.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
syncScale();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  floor.getRenderTarget().setSize(Math.floor(innerWidth * Q.dpr * Q.refl), Math.floor(innerHeight * Q.dpr * Q.refl));
  syncScale();
});

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
let bank = 0;
const view = { v: 0 };
const qIn = new THREE.Quaternion(), qFar = new THREE.Quaternion(), eIn = new THREE.Euler();
const pIn = new THREE.Vector3(), pFar = new THREE.Vector3(), lookM = new THREE.Matrix4(), UP = new THREE.Vector3(0, 1, 0);
const FAR_TARGET = new THREE.Vector3(0, 2.4, -12);
const tmpA = new THREE.Color(), tmpB = new THREE.Color();
startShow(0); show.blend = 1;

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;

  // shows
  show.t += dt; show.blend = Math.min(1, show.blend + dt / XFADE);
  if (show.t > SHOW_DUR) startShow(show.loop ? show.idx : (show.idx + 1) % SHOWS.length);
  document.getElementById('seqBar').style.width = Math.min(1, show.t / SHOW_DUR) * 100 + '%';
  const b = show.blend * show.blend * (3 - 2 * show.blend);
  shared.uShowA.value = show.prev; shared.uTA.value = show.prevT + show.t;
  shared.uShowB.value = show.idx;  shared.uTB.value = show.t;
  shared.uMix.value = b;
  shared.uTime.value = t;
  mistMat.uniforms.uOn.value += ((mistOn ? 1 : 0) - mistMat.uniforms.uOn.value) * (1 - Math.exp(-2 * dt));

  // floor glow follows the overall colour of the show
  samplePalette(t * 0.045, tmpA); samplePalette(t * 0.045 + 0.45, tmpB);
  floorU.uGlow.value.lerp(tmpA.lerp(tmpB, 0.3), 1 - Math.exp(-2 * dt));

  // walking — keys give a temporary push forward / back
  let target = walk.pace;
  if (keys.KeyW || keys.ArrowUp) target = Math.max(target, 0) + 2.2;
  if (keys.KeyS || keys.ArrowDown) target = Math.min(target, 0) - 1.2;
  walk.speed += (target - walk.speed) * (1 - Math.exp(-1.8 * dt));
  walk.travel += walk.speed * dt;
  shared.uTravel.value = walk.travel;
  shared.uCamS.value = walk.travel;
  shared.uBend.value += ((routeWinding ? 1 : 0) - shared.uBend.value) * (1 - Math.exp(-0.8 * dt));

  // smooth glide — no bob or sway
  const sp = Math.abs(walk.speed);
  camera.position.set(0, EYE, 0);

  // looking — drift back to centre after a while; a slow idle gaze up into the arches
  if (!drag && t - look.lastInput > 6) {
    look.tYaw += (Math.sin(t * 0.07) * 0.12 - look.tYaw) * (1 - Math.exp(-0.5 * dt));
    look.tPitch += (0.06 + Math.max(0, Math.sin(t * 0.05)) * 0.22 - look.tPitch) * (1 - Math.exp(-0.5 * dt));
  }
  look.yaw += (look.tYaw - look.yaw) * (1 - Math.exp(-8 * dt));
  look.pitch += (look.tPitch - look.pitch) * (1 - Math.exp(-8 * dt));
  bank += (-pXdd(walk.travel) * shared.uBend.value * Math.min(1.5, Math.abs(walk.speed) / 1.35) * 1.6 - bank) * (1 - Math.exp(-2 * dt));
  // inside camera
  qIn.setFromEuler(eIn.set(look.pitch, -look.yaw, bank, 'YXZ'));
  pIn.set(0, EYE, 0);
  // far camera: third person — behind and above, looking down the same route
  if (!drag && t - orbit.lastInput > 6) {
    orbit.tAz += (CHASE.az - orbit.tAz) * (1 - Math.exp(-0.6 * dt));
    orbit.tEl += (CHASE.el - orbit.tEl) * (1 - Math.exp(-0.6 * dt));
  }
  orbit.az += (orbit.tAz - orbit.az) * (1 - Math.exp(-6 * dt));
  orbit.el += (orbit.tEl - orbit.el) * (1 - Math.exp(-6 * dt));
  const ce = Math.cos(orbit.el);
  pFar.set(Math.sin(orbit.az) * ce, Math.sin(orbit.el), Math.cos(orbit.az) * ce).multiplyScalar(orbit.dist).add(FAR_TARGET);
  qFar.setFromRotationMatrix(lookM.lookAt(pFar, FAR_TARGET, UP));
  // blend between them
  view.v += ((viewAfar ? 1 : 0) - view.v) * (1 - Math.exp(-1.4 * dt));
  const v = view.v * view.v * (3 - 2 * view.v);
  camera.position.lerpVectors(pIn, pFar, v);
  camera.quaternion.slerpQuaternions(qIn, qFar, v);
  shared.uNear.value = THREE.MathUtils.lerp(NEAR, 14, v);
  shared.uBackW.value = THREE.MathUtils.lerp(0.5, 6, v);
  mistMat.uniforms.uView.value = v;

  if (audio && audio.on) audio.lp.frequency.setTargetAtTime(600 + b * 500 + sp * 120, audio.ctx.currentTime, 0.5);

  composer.render();
}
function tick() { requestAnimationFrame(tick); try { frame(); } catch (err) { console.error(err); } }
requestAnimationFrame(() => {
  tick();
  const l = document.getElementById('loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 900);
});
</script>
