<!DOCTYPE html>

<style>
  :root {
    --glass: rgba(18, 16, 30, 0.55);
    --line: rgba(255, 255, 255, 0.12);
    --text: #ece9ff;
    --dim: rgba(236, 233, 255, 0.55);
    --accent: #b98cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a1820; overflow: hidden; color: var(--text);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .title { position: fixed; top: calc(22px + env(safe-area-inset-top)); left: 26px; user-select: none; }
  .title h1 { margin: 0; font-size: 13px; letter-spacing: 0.38em; font-weight: 600; pointer-events: none; }
  .title p { margin: 6px 0 0; font-size: 11px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; pointer-events: none; }
  .series { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .series a, .series span { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none;
    color: var(--dim); padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .series a:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  .series span { color: #fff; border-color: rgba(185, 140, 255, 0.55); background: rgba(185, 140, 255, 0.18); }
  .fade { position: fixed; inset: 0; background: #1a1820; opacity: 0; pointer-events: none; transition: opacity .45s; z-index: 20; }
  .fade.on { opacity: 1; }
  .nogl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: #1a1820; z-index: 30;
    font-size: 12px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; line-height: 1.8; }

  .now { position: fixed; top: calc(22px + env(safe-area-inset-top)); right: 26px; text-align: right; pointer-events: none; user-select: none; }
  .now .label { font-size: 10px; letter-spacing: 0.24em; color: var(--dim); text-transform: uppercase; }
  .now .name { font-size: 15px; margin-top: 4px; font-weight: 500; letter-spacing: 0.04em; transition: opacity .45s; }
  .now .bar { width: 140px; height: 2px; background: var(--line); margin: 8px 0 0 auto; border-radius: 2px; overflow: hidden; }
  .now .music { font-size: 10px; letter-spacing: 0.2em; color: var(--dim); margin-top: 10px; text-transform: uppercase;
    font-variant-numeric: tabular-nums; display: none; align-items: center; justify-content: flex-end; gap: 7px; }
  .now .music.show { display: flex; }
  .now .music i { width: 7px; height: 7px; border-radius: 50%; background: #ff5fc4; box-shadow: 0 0 10px #ff5fc4; opacity: .25; }
  .dock input[type=file] { display: none; }

  /* file player: appears above the dock in File mode */
  .player { position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(620px, calc(100vw - 20px)); display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 7px;
    border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .player[hidden] { display: none; }
  .player button { appearance: none; border: 0; background: transparent; color: var(--text); cursor: pointer;
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; transition: background .2s; }
  .player button:hover { background: rgba(255,255,255,0.07); }
  .player button.on { background: rgba(185, 140, 255, 0.2); }
  .player button svg { width: 15px; height: 15px; fill: currentColor; }
  .player .name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); letter-spacing: .02em; flex: none; }
  .player .seek { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .player .vol { display: flex; align-items: center; gap: 2px; flex: none; }
  .player input[type=range] { -webkit-appearance: none; appearance: none; height: 16px; background: transparent; cursor: pointer; margin: 0; }
  .player input[type=range]#seek { flex: 1; min-width: 0; }
  .player input[type=range]#vol { width: 64px; }
  .player input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, #b46bff 0 var(--p,0%), rgba(255,255,255,.16) var(--p,0%) 100%); }
  .player input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(255,255,255,.16); }
  .player input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: #b46bff; }
  .player input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: #fff; margin-top: -4px; box-shadow: 0 0 8px rgba(185,140,255,.8); }
  .player input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: #fff; }
  body.has-player .hint { bottom: calc(126px + env(safe-area-inset-bottom)); }
  @media (max-width: 640px) {
    .player .name, .player .vol input { display: none; }
    .player { bottom: calc(66px + env(safe-area-inset-bottom)); }
  }
  .now .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4f8bff, #b46bff, #ff5fc4, #3dffa8); }

  .dock { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .group { display: flex; gap: 2px; padding: 0 4px; border-right: 1px solid var(--line); }
  .group:last-child { border-right: 0; }
  .dock button, .dock select {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 12px; letter-spacing: 0.02em; padding: 8px 11px; border-radius: 10px; cursor: pointer;
    white-space: nowrap; transition: background .2s, color .2s; }
  .dock select { padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 13px) 52%, calc(100% - 9px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
  .dock select option { background: #15131f; color: var(--text); }
  .dock button:hover, .dock select:hover { background: rgba(255,255,255,0.07); }
  .dock button.on { background: rgba(185, 140, 255, 0.2); color: #fff; }
  .dock .tag { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; align-self: center; padding: 0 4px 0 6px; }

  .hint { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; pointer-events: none;
    transition: opacity 1.2s; white-space: nowrap; }

  .loader { position: fixed; inset: 0; display: grid; place-items: center; background: #1a1820; z-index: 10; transition: opacity .8s; }
  .loader span { font-size: 11px; letter-spacing: 0.3em; color: var(--dim); }

  @media (max-width: 900px) { .title { max-width: calc(100vw - 210px); } }
  @media (max-width: 640px) {
    .title { top: calc(16px + env(safe-area-inset-top)); left: 16px; }
    .now { top: calc(16px + env(safe-area-inset-top)); right: 16px; }
    .now .bar { width: 100px; }
    .dock .tag { display: none; }
    .hint { font-size: 10px; }
  }
</style>

<div class="loader" id="loader"><span>GROWING THE TREES…</span></div>

<div class="title">
  <h1>PROJECTION GROVE</h1>
  <p>Light show series · No. 3</p>
  <div class="series">

    <a href="../light-tunnel/">02 Light Tunnel</a>
    <span>03 Projection Grove</span>
  </div>
</div>

<div class="now">

  <div class="music" id="music"><i id="beatDot"></i><span id="musicText">Listening…</span></div>
</div>

<div class="hint" id="hint">Drag to orbit · Scroll to zoom · ← / → to switch looks · Space to hold · Music to sync</div>

<div class="dock">
  <div class="group">
    <span class="tag">Look</span>
    <select id="seqSelect" aria-label="Look"></select>
    <button id="loopBtn" title="Hold the current look instead of moving on">Loop</button>
  </div>
  <div class="group">
    <span class="tag">Camera</span>
    <button id="orbitBtn" class="on" title="Slow automatic orbit">Orbit</button>
  </div>
  <div class="group">
    <button id="mistBtn" class="on" title="Fog / haze">Mist</button>
  </div>
  <div class="group">
    <span class="tag">Music</span>
    <button id="micBtn" title="Listen to music in the room through the microphone">Mic</button>
    <button id="tabBtn" title="Share a browser tab's audio (YouTube, SoundCloud…), desktop Chrome / Edge">Tab</button>
    <button id="fileBtn" title="Play an audio file from your computer">File</button>
    <button id="tapBtn" title="Tap along with the beat (or press T)">Tap</button>
    <button id="offBtn" title="Stop music sync" hidden>✕</button>
    <input type="file" id="fileIn" accept="audio/*" />
  </div>
</div>

<div class="player" id="player" hidden>
  <button id="playBtn" title="Play / pause (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg></button>
  <span class="name" id="trackName"></span>
  <div class="seek">
    <span id="tCur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Scrub through the track" />
    <span id="tDur">0:00</span>
  </div>
  <button id="repeatBtn" class="on" title="Repeat the track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  <div class="vol">
    <button id="muteBtn" title="Mute (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9zm12.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" aria-label="Volume" />
  </div>
</div>

<div class="fade" id="fade"></div>
<script>
  // soft fade between the shows in the series
  document.querySelectorAll('.series a').forEach(a => a.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); document.getElementById('fade').classList.add('on');
    setTimeout(() => { location.href = a.href; }, 420);
  }));
  addEventListener('pageshow', () => document.getElementById('fade').classList.remove('on'));
  // friendly message when WebGL isn't available
  (() => { const c = document.createElement('canvas');
    if (!(c.getContext('webgl2') || c.getContext('webgl'))) {
      const d = document.createElement('div'); d.className = 'nogl';
      d.innerHTML = 'This light show needs WebGL.<br>Try a current version of Chrome, Safari, Edge or Firefox.';
      document.body.appendChild(d); } })();
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const LOOKS = ['Liquid Light','Fountain Ripples','Sap Rising','Living Lichen','Kaleidoscope','Op-Art Sweep'];
const HOLD = 14, FADE = 3.2;

/* ---------- shared GLSL ---------- */
const GLSL_COMMON = /* glsl */`
uniform float uTime; uniform int uA; uniform int uB; uniform float uMix;
uniform float uKick; uniform float uAudio; uniform float uBeats[6];
// rings that leave the center on each detected beat (radius grows with age)
float beatRings(float d, float speed, float width){
  float r=0.;
  for(int i=0;i<6;i++){
    float age=uTime-uBeats[i];
    if(age<0. || age>4.) continue;
    r+=smoothstep(width,0.,abs(d-age*speed))*exp(-age*1.1);
  }
  return r*uAudio;
}
float hash(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
vec3 pal(float t){
  t=fract(t)*4.; float f=smoothstep(0.,1.,fract(t));
  vec3 c0=vec3(.10,.32,1.), c1=vec3(.58,.18,1.), c2=vec3(1.,.18,.66), c3=vec3(.12,1.,.58);
  if(t<1.) return mix(c0,c1,f); if(t<2.) return mix(c1,c2,f); if(t<3.) return mix(c2,c3,f); return mix(c3,c0,f);
}
float wLook(int m){ return (uA==m?1.-uMix:0.)+(uB==m?uMix:0.); }
`;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
let pixelRatio = Math.min(devicePixelRatio, 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// backdrop: same charcoal gradient and horizon fog as Fountain Court
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#1d1b23'); g.addColorStop(0.55, '#2c2934'); g.addColorStop(1, '#0f0e13');
  x.fillStyle = g; x.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
scene.fog = new THREE.FogExp2(0x1d1b23, 0.016);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 11.5, 34);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6.5, -4);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.28;
controls.minDistance = 7; controls.maxDistance = 56; controls.maxPolarAngle = Math.PI*0.53;
controls.enablePan = false;

scene.add(new THREE.HemisphereLight(0x1c2a55, 0x040308, 0.22));

const U = { uTime:{value:0}, uA:{value:0}, uB:{value:0}, uMix:{value:0},
  uKick:{value:0}, uAudio:{value:0}, uBeats:{value:new Array(6).fill(-100)} };

/* ---------- projector content (render target) ---------- */
const rt = new THREE.WebGLRenderTarget(1024, 1024, { generateMipmaps:false });
const rtScene = new THREE.Scene();
const rtCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
rtScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: GLSL_COMMON + /* glsl */`
  varying vec2 vUv;
  vec3 look(int m, vec2 uv, float t){
    vec2 p=uv-.5;
    if(m==0){ // liquid light — oil & water
      vec3 P=vec3(p*2.6, t*.04);
      vec2 q=vec2(fbm(P+vec3(0.,0.,t*.06)), fbm(P+vec3(5.2,1.3,-t*.05)));
      float r=fbm(vec3(p*2.6+3.2*q, t*.08));
      float cells=smoothstep(.36,.6,r);
      float rim=smoothstep(.035,.0,abs(r-.47));
      return pal(r*1.7+t*.025)*(cells*1.05+.03) + pal(r*1.7+t*.025+.5)*rim*1.3;
    }
    if(m==1){ // ripples out from the fountain
      float d=length(p);
      float w=fract(d*7.-t*.5);
      float ring=smoothstep(0.,.012,w)*smoothstep(.07,.012,w);
      return pal(d*1.4-t*.1)*ring*1.15*smoothstep(.72,.08,d) + pal(t*.05)*.03;
    }
    if(m==2){ // sap — rising streaks (veins glow on the trees themselves)
      float n=fbm(vec3(p.x*16., p.y*1.6-t*.55, t*.08));
      return pal(uv.y*.5-t*.08)*pow(smoothstep(.48,.82,n),2.)*.75;
    }
    if(m==3){ // living lichen — spreading turing-like spots
      vec3 P=vec3(p*5.2, t*.015);
      float n=fbm(P);
      float v=sin(n*40.+fbm(P*2.1)*7.);
      float spots=smoothstep(.5,.88,v);
      float front=mod(t*.055,1.35);
      float grow=smoothstep(0.,.07, front-fbm(vec3(p*1.9,7.)));
      float edge=smoothstep(.07,0.,abs(front-fbm(vec3(p*1.9,7.))-.02));
      vec3 c=mix(vec3(.1,1.,.5), vec3(.25,.55,1.), fbm(P*.6+3.));
      return c*spots*grow*1.5 + vec3(.9,.4,1.)*edge*spots*1.6;
    }
    if(m==4){ // kaleidoscope
      float r=length(p); float a=atan(p.y,p.x)+t*.11;
      float seg=6.2831853/8.;
      a=mod(a,seg); a=abs(a-seg*.5);
      vec2 q=vec2(cos(a),sin(a))*r;
      float n=fbm(vec3(q*6.5-vec2(t*.16,0.), t*.06));
      float petals=smoothstep(.42,.66,n) + .7*smoothstep(.04,0.,abs(fract(r*9.-t*.35)-.5)-.015)*smoothstep(.5,.1,r);
      return pal(n*1.2+r*.8-t*.05)*petals*1.6;
    }
    // op-art sweep — interfering stripe fields
    float ang=t*.05;
    vec2 d1=vec2(cos(ang),sin(ang)), d2=vec2(cos(-ang*1.3+.35),sin(-ang*1.3+.35));
    float s1=step(.5,fract(dot(p,d1)*52.+sin(p.y*15.+t*.8)*.8-t*.55));
    float s2=step(.5,fract(dot(p,d2)*56.+t*.35));
    return pal(floor(t*.2)*.25+length(p)*.5)*abs(s1-s2)*1.15;
  }
  void main(){
    vec3 c=mix(look(uA,vUv,uTime), look(uB,vUv,uTime), uMix);
    float dd=length(vUv-.5);
    c+=pal(dd*1.4-uTime*.1)*beatRings(dd,.32,.01)*(.35+.9*wLook(1));
    c*=1.+uKick*.55*uAudio;
    c*=smoothstep(.72,.32,dd);
    gl_FragColor=vec4(c,1.);
  }`
})));

/* ---------- materials with world-space glow (ripples + sap) ---------- */
function glowMaterial(params, opts){
  const m = new THREE.MeshStandardMaterial(params);
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, U);
    s.vertexShader = 'varying vec3 vWPos;\n' + s.vertexShader.replace('#include <project_vertex>',
      `#include <project_vertex>
       vec4 wp=vec4(transformed,1.);
       #ifdef USE_INSTANCING
         wp=instanceMatrix*wp;
       #endif
       vWPos=(modelMatrix*wp).xyz;`);
    s.fragmentShader = (opts.sap?'#define SAP\n':'') + (opts.leafSap?'#define LEAF_SAP\n':'') +
      `#define RIPPLE_GAIN ${opts.gain.toFixed(2)}\n#define RIPPLE_FALL ${opts.fall.toFixed(3)}\n` +
      'varying vec3 vWPos;\n' + GLSL_COMMON + s.fragmentShader.replace(
      '#include <emissivemap_fragment>', /* glsl */`
      #include <emissivemap_fragment>
      vec3 glow=vec3(0.);
      float wr=wLook(1);
      if(wr>.001){
        float d=length(vec3(vWPos.x, vWPos.y*.55, vWPos.z));
        float w=fract(d*.17-uTime*.4);
        float ring=smoothstep(0.,.01,w)*smoothstep(.055,.01,w);
        glow+=pal(d*.05-uTime*.1)*ring*wr*RIPPLE_GAIN*exp(-d*RIPPLE_FALL);
      }
      #ifdef SAP
      float ws=wLook(2);
      if(ws>.001){
        float n=vnoise(vec3(vWPos.x*2.2, vWPos.y*.3, vWPos.z*2.2));
        float n2=vnoise(vec3(vWPos.x*4.8, vWPos.y*.6, vWPos.z*4.8)+11.);
        float vein=smoothstep(.06,0.,abs(n-.5)) + .6*smoothstep(.045,0.,abs(n2-.5));
        float pulse=pow(fract(vWPos.y*.09-uTime*.3+n*.4),5.);
        glow+=pal(vWPos.y*.04-uTime*.07)*vein*(pulse*(2.8+uKick*3.*uAudio)+.06)*ws*1.5;
      }
      #endif
      #ifdef LEAF_SAP
      float wl=wLook(2);
      if(wl>.001){
        float pulse=pow(fract(vWPos.y*.09-uTime*.3+vnoise(vWPos*.7)*.5),9.);
        float sparkle=step(.55,vnoise(vWPos*3.1));
        glow+=pal(vWPos.y*.04-uTime*.07)*pulse*sparkle*wl*1.6*(1.+uKick*1.5*uAudio);
      }
      #endif
      float bd=length(vWPos.xz);
      glow+=pal(bd*.05-uTime*.1)*beatRings(bd,12.,.28)*RIPPLE_GAIN*(.35+.9*wLook(1));
      totalEmissiveRadiance+=glow;`);
    if(opts.fade) s.fragmentShader = s.fragmentShader.replace('#include <dithering_fragment>',
      `#include <dithering_fragment>
      gl_FragColor.a *= 1.-smoothstep(${opts.fade[0].toFixed(1)}, ${opts.fade[1].toFixed(1)}, length(vWPos.xz));`);
  };
  return m;
}

/* ---------- procedural textures ---------- */
function canvasTex(w, h, draw, srgb=true){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const rng = rngFrom(20261114);

const barkTex = canvasTex(256, 512, (g,w,h) => {
  g.fillStyle='#a49e95'; g.fillRect(0,0,w,h);
  // seamless tile: every streak is also drawn shifted by one tile in each direction,
  // so marks that run off an edge continue on the opposite side (no band where the bark repeats)
  const tiled = (draw) => { for(const ox of [-w,0,w]) for(const oy of [-h,0,h]){ g.save(); g.translate(ox,oy); draw(); g.restore(); } };
  for(let i=0;i<1400;i++){
    let x=rng()*w, y=rng()*h; const len=30+rng()*220, a=.08+rng()*.5;
    g.strokeStyle=`rgba(${30+rng()*20|0},${26+rng()*16|0},${22+rng()*14|0},${a})`;
    g.lineWidth=.6+rng()*3.2;
    const pts=[[x,y]]; for(let k=0;k<len;k+=8){ x+=(rng()-.5)*3; y+=8; pts.push([x,y]); }
    tiled(() => { g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) g.lineTo(pts[j][0],pts[j][1]); g.stroke(); });
  }
  for(let i=0;i<500;i++){ g.fillStyle=`rgba(255,250,240,${rng()*.08})`; const rx=rng()*w, ry=rng()*h, rw=1+rng()*4, rh=4+rng()*18;
    tiled(() => g.fillRect(rx,ry,rw,rh)); }
});

/* ---------- procedural trees: curved tapering limbs + leaf-card foliage ---------- */
function rngFrom(seed){ return () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const randUnit = (R) => { const z=R()*2-1, a=R()*Math.PI*2, r=Math.sqrt(1-z*z); return V(Math.cos(a)*r, z, Math.sin(a)*r); };
const lerp = (a,b,t) => a+(b-a)*t;

const LEVELS = [
  { len:[5.6,6.6], segs:16, radial:18, kids:[7,9], range:[.32,.97], ang:[.8,1.3], curl:.07, trop:.035 },
  { len:[5.0,6.8], segs:12, radial:11, kids:[6,8], range:[.15,1.0], ang:[.5,.95],  curl:.12, trop:.025 },
  { len:[1.7,2.7], segs:6,  radial:6,  kids:[4,6], range:[.2,1.0],  ang:[.6,1.05], curl:.16, trop:.0 },
  { len:[.9,1.5],  segs:3,  radial:4,  kids:[0,0], range:[0,0],     ang:[0,0],     curl:.22, trop:-.09 },
];
const leafMatrices = [], leafColors = [];
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = V();
function pushLeaf(pos, size, R, tint, flat=false){
  if(flat) _e.set(-Math.PI/2+(R()-.5)*.3, 0, R()*Math.PI*2);
  else _e.set(R()*Math.PI*2, R()*Math.PI*2, R()*Math.PI*2);
  _q.setFromEuler(_e); _s.set(size,size,size);
  leafMatrices.push(new THREE.Matrix4().compose(pos, _q, _s));
  leafColors.push(new THREE.Color().setHSL(.27+R()*.06, .12+R()*.12, tint*(.55+R()*.25)));
}

function buildTree(seed, at, scale){
  const R = rngFrom(seed);
  const P=[], N=[], UV=[], I=[]; let base=0;

  function tube(pts, radii, radial){
    const n=pts.length, T=[], Nm=[], Bn=[];
    for(let i=0;i<n;i++) T[i]=(i<n-1? pts[i+1].clone().sub(pts[i]) : pts[i].clone().sub(pts[i-1])).normalize();
    let ref = Math.abs(T[0].y)>.9 ? V(1,0,0) : V(0,1,0);
    Nm[0]=V().crossVectors(T[0],ref).normalize();
    for(let i=1;i<n;i++){
      const ax=V().crossVectors(T[i-1],T[i]); const l=ax.length();
      Nm[i]=Nm[i-1].clone();
      if(l>1e-6) Nm[i].applyAxisAngle(ax.divideScalar(l), Math.acos(THREE.MathUtils.clamp(T[i-1].dot(T[i]),-1,1)));
    }
    let vlen=0; const uRep=Math.max(1,Math.round(radii[0]*6));
    for(let i=0;i<n;i++){
      Bn[i]=V().crossVectors(T[i],Nm[i]);
      if(i>0) vlen+=pts[i].distanceTo(pts[i-1]);
      for(let j=0;j<=radial;j++){
        const a=j/radial*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
        const d=Nm[i].clone().multiplyScalar(c).addScaledVector(Bn[i],s);
        const r=radii[i]*(1+.06*Math.sin(a*5+i*.9+seed)+.04*Math.sin(a*11-i*1.7));
        const p=pts[i].clone().addScaledVector(d,r);
        P.push(p.x,p.y,p.z); N.push(d.x,d.y,d.z); UV.push(j/radial*uRep, vlen*.45);
      }
    }
    for(let i=0;i<n-1;i++) for(let j=0;j<radial;j++){
      const a=base+i*(radial+1)+j, b=a+radial+1;
      I.push(a,a+1,b, b,a+1,b+1);
    }
    base+=n*(radial+1);
  }

  function branch(level, start, dir, len, rad){
    const L=LEVELS[level], pts=[start.clone()], radii=[];
    const d=dir.clone(), step=len/L.segs; let p=start.clone();
    for(let s=1;s<=L.segs;s++){
      d.addScaledVector(randUnit(R), L.curl); d.y+=L.trop; d.normalize();
      p=p.clone().addScaledVector(d,step); pts.push(p);
    }
    const radAt = (t) => rad*(1-.74*t)*(level===0 ? 1+.85*Math.pow(Math.max(0,1-t/.14),2) : 1);
    for(let s=0;s<=L.segs;s++) radii.push(radAt(s/L.segs));
    tube(pts, radii, L.radial);

    const pointAt = (t) => { const f=t*L.segs, i=Math.min(Math.floor(f),L.segs-1), k=f-i;
      return { p: pts[i].clone().lerp(pts[i+1],k), d: pts[i+1].clone().sub(pts[i]).normalize() }; };

    if(level<3){
      const nk = L.kids[0] + Math.floor(R()*(L.kids[1]-L.kids[0]+1));
      let phi = R()*Math.PI*2;
      for(let k=0;k<nk;k++){
        const t = lerp(L.range[0], L.range[1], Math.min(1,(k+.2+R()*.6)/nk));
        const {p:sp, d:pd} = pointAt(t);
        phi += 2.39996;
        let perp = V().crossVectors(pd, Math.abs(pd.y)>.9?V(1,0,0):V(0,1,0)).normalize().applyAxisAngle(pd, phi);
        const ang = lerp(L.ang[0], L.ang[1], R());
        const cd = pd.clone().multiplyScalar(Math.cos(ang)).addScaledVector(perp, Math.sin(ang)).normalize();
        const NL = LEVELS[level+1];
        let cl = lerp(NL.len[0], NL.len[1], R())*scale;
        cl *= level===0 ? (1.15-.45*t) : (1.05-.4*t);
        branch(level+1, sp, cd, cl, radAt(t)*lerp(.55,.72,R()));
      }
    }
    // foliage
    if(level>=2){
      const count = level===3 ? 26 : 8;
      for(let k=0;k<count;k++){
        const t = level===3 ? R() : .45+R()*.55;
        const {p:lp} = pointAt(t);
        lp.addScaledVector(randUnit(R), .15+R()*.65);
        pushLeaf(lp, .6+R()*.42, R, 1);
      }
    }
  }

  const tilt = V((R()-.5)*.14, 1, (R()-.5)*.14).normalize();
  branch(0, at.clone().setY(-.3), tilt, lerp(LEVELS[0].len[0],LEVELS[0].len[1],R())*scale, .62*scale);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(UV,2));
  g.setIndex(I);
  const mesh = new THREE.Mesh(g, barkMat);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
}

const beams = [];
function projector(pos, target, angle, intensity, shadowRes=2048){
  const L = new THREE.SpotLight(0xffffff, intensity, 0, angle, .38, 0);
  L.position.copy(pos); L.target.position.copy(target);
  L.map = rt.texture;
  L.castShadow = true; L.shadow.mapSize.set(shadowRes,shadowRes);
  L.shadow.camera.near = 2; L.shadow.camera.far = 70; L.shadow.bias = -0.0004; L.shadow.normalBias = .02;
  scene.add(L, L.target);

  const len = pos.distanceTo(target)*1.55, rad = Math.tan(angle)*len;
  const cone = new THREE.ConeGeometry(rad, len, 64, 1, true);
  cone.translate(0, -len/2, 0);
  const beam = new THREE.Mesh(cone, new THREE.ShaderMaterial({
    uniforms:{ uColor:{value:new THREE.Color()}, uLen:{value:len}, uOp:{value:.05} },
    transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
    vertexShader:`uniform float uLen; varying float vH; varying vec3 vN; varying vec3 vV;
      void main(){ vH=-position.y/uLen; vec4 mv=modelViewMatrix*vec4(position,1.);
        vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 uColor; uniform float uOp; varying float vH; varying vec3 vN; varying vec3 vV;
      void main(){ float edge=pow(abs(dot(vN,vV)),1.6);
        float a=uOp*pow(max(1.-vH,0.),1.4)*smoothstep(0.,.04,vH)*edge;
        gl_FragColor=vec4(uColor*a,1.); }`
  }));
  beam.position.copy(pos);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), target.clone().sub(pos).normalize());
  // beam cones and projector lenses are left out of the scene: the light lands on the trees without visible fixtures
  return L;
}

  if(A.src) try{ A.src.disconnect(); }catch(e){}
  if(A.gain) try{ A.gain.disconnect(); }catch(e){}
  A.stream = A.el = A.src = A.an = A.gain = null;
  setMode(null);
  showPlayer(false);
}
function ensureCtx(){
  if(!A.ctx) A.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(A.ctx.state === 'suspended') A.ctx.resume();
  return A.ctx;
}
function attach(node, mode, toSpeakers){
  const ctx = A.ctx, an = ctx.createAnalyser();
  an.fftSize = 2048; an.smoothingTimeConstant = .15;
  node.connect(an);
  if(toSpeakers){ A.gain = ctx.createGain(); A.gain.gain.value = playerVolume(); node.connect(A.gain).connect(ctx.destination); }
  A.src = node; A.an = an;
  A.freq = new Uint8Array(an.frequencyBinCount); A.prev = new Float32Array(an.frequencyBinCount);
  A.wave = new Float32Array(an.fftSize);
  setMode(mode);
}
const raw = { echoCancellation:false, noiseSuppression:false, autoGainControl:false };

async function startMic(){
  stopAudio(); ensureCtx();
  try{
    A.stream = await navigator.mediaDevices.getUserMedia({ audio: raw });
    attach(A.ctx.createMediaStreamSource(A.stream), 'mic', false);
    say('Listening through the microphone. Play some music nearby');
  }catch(e){ stopAudio(); say(location.protocol==='file:' ? 'The microphone needs the page served over http(s). Try the GitHub Pages link or a local server'
                               : 'Microphone access was blocked. Allow it in the browser to sync to music'); }
}
async function startTab(){
  stopAudio(); ensureCtx();
  try{
    const st = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:{ ...raw, suppressLocalAudioPlayback:false },
      selfBrowserSurface:'exclude', systemAudio:'include' });
    if(!st.getAudioTracks().length){ st.getTracks().forEach(t=>t.stop()); stopAudio();
      say('No audio was shared. Pick the tab with your music and turn on "Share tab audio"', 7000); return; }
    st.getVideoTracks().forEach(t => t.stop());           // only the sound is needed
    st.getAudioTracks()[0].addEventListener('ended', stopAudio);
    A.stream = st;
    attach(A.ctx.createMediaStreamSource(new MediaStream(st.getAudioTracks())), 'tab', false);
    say('Syncing to the shared tab’s audio');
  }catch(e){ stopAudio(); say('Tab sharing was cancelled'); }
}
function startFile(file){
  stopAudio(); ensureCtx();
  const el = new Audio(); el.src = URL.createObjectURL(file); el.loop = repeatOn; el.crossOrigin = 'anonymous';
  A.el = el;
  attach(A.ctx.createMediaElementSource(el), 'file', true);
  bindPlayer(el, file.name.replace(/\.[^.]+$/, ''));
  el.play().catch(() => say('Press play to start the track'));
  say('Playing ' + file.name.replace(/\.[^.]+$/, ''));
}
function tap(){
  const t = now();
  if(A.mode !== 'tap'){ stopAudio(); setMode('tap'); }
  if(A.taps.length && t - A.taps[A.taps.length-1] > 2) A.taps = [];
  A.taps.push(t); if(A.taps.length > 6) A.taps.shift();
  if(A.taps.length >= 2){
    const d = []; for(let i=1;i<A.taps.length;i++) d.push(A.taps[i]-A.taps[i-1]);
    A.tapInt = d.reduce((a,b)=>a+b,0)/d.length; A.bpm = 60/A.tapInt; A.tapNext = t + A.tapInt;
  } else say('Keep tapping along with the beat (or press T)', 3500);
  beat(t, true);
}

mBtns.mic.onclick = () => A.mode==='mic' ? stopAudio() : startMic();
mBtns.tab.onclick = () => A.mode==='tab' ? stopAudio() : startTab();
mBtns.file.onclick = () => { if(A.mode==='file'){ stopAudio(); return; } ensureCtx(); fileIn.click(); };
fileIn.onchange = () => { if(fileIn.files[0]) startFile(fileIn.files[0]); fileIn.value = ''; };
mBtns.tap.onclick = tap;
offBtn.onclick = stopAudio;
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); const f = [...(e.dataTransfer?.files||[])].find(f => f.type.startsWith('audio/')); if(f) startFile(f); });

// one beat: kick envelope, a ring from the pool, and the bar counter for look changes
function beat(t, fromTap=false){
  if(!fromTap && A.lastBeat > 0){
    const iv = t - A.lastBeat;
    if(iv > .25 && iv < 2.2){
      let bpm = 60/iv; while(bpm < 78) bpm *= 2; while(bpm > 178) bpm /= 2;
      A.intervals.push(bpm); if(A.intervals.length > 16) A.intervals.shift();
      const s = [...A.intervals].sort((a,b)=>a-b); A.bpm = s[s.length>>1];
    }
  }
  A.lastBeat = t; A.kick = 1; A.beats++;
  U.uBeats.value[A.beatHead] = U.uTime.value; A.beatHead = (A.beatHead+1) % 6;
  if(!loop && target===null && A.beats % BEATS_PER_LOOK === 0) goTo(cur+1);
}

// audio analysis runs on its own ~100 Hz clock so beat timing doesn't depend on the frame rate
let lastTick = 0;
function audioTick(){
  if(A.mode === 'tap'){
    const t = now();
    if(A.tapInt && t >= A.tapNext){ beat(t, true); A.tapNext += A.tapInt; if(A.tapNext < t) A.tapNext = t + A.tapInt; }
    return;
  }
  if(!A.an) return;
  const t = now(), dt = lastTick ? Math.min(t - lastTick, .1) : .01; lastTick = t;
  const an = A.an, binHz = A.ctx.sampleRate/an.fftSize;
  an.getByteFrequencyData(A.freq);
  const lo = Math.max(1, Math.floor(35/binHz)), hi = Math.ceil(160/binHz);
  let flux = 0;
  for(let i=lo;i<=hi;i++){ const v = A.freq[i]/255, d = v - A.prev[i]; if(d > 0) flux += d; A.prev[i] = v; }
  flux /= (hi-lo+1);
  if(t < A.skipUntil){ A.hist = []; return; }
  an.getFloatTimeDomainData(A.wave);
  let rms = 0; for(let i=0;i<A.wave.length;i++) rms += A.wave[i]*A.wave[i];
  rms = Math.sqrt(rms/A.wave.length);
  A.peak = Math.max(rms, A.peak*Math.exp(-dt/8), .004);
  A.level += (Math.min(1, rms/A.peak) - A.level) * Math.min(1, dt*5);
  A.hist.push([t, flux]); while(A.hist.length && t - A.hist[0][0] > 1.5) A.hist.shift();
  let m = 0; A.hist.forEach(h => m += h[1]); m /= A.hist.length;
  let v = 0; A.hist.forEach(h => v += (h[1]-m)**2); const sd = Math.sqrt(v/A.hist.length);
  const minGap = A.bpm ? Math.min(.6*60/A.bpm, .42) : .28;
  const warm = t - A.hist[0][0] > .5;
  if(warm && flux > m + 1.5*sd && flux > .018 && t - A.lastBeat > minGap) beat(t);
}
setInterval(audioTick, 10);

// per-frame: kick envelope, uniforms and the BPM readout
function analyse(dt){
  A.kick *= Math.exp(-dt*7);
  U.uKick.value = A.kick;
  U.uAudio.value += ((A.mode ? 1 : 0) - U.uAudio.value) * Math.min(1, dt*3);
  if(A.mode){
    beatDot.style.opacity = (.25 + .75*A.kick).toFixed(2);
    const label = { mic:'Mic', tab:'Tab', file:'File', tap:'Tap' }[A.mode];
    musicText.textContent = A.bpm ? `${label} · ${Math.round(A.bpm)} BPM` : `${label} · listening…`;
  }
}
// music is "driving" while beats keep arriving; after a few silent seconds the timer takes over again
const musicDriving = () => A.mode && (A.mode==='tap' ? A.tapInt>0 : now() - A.lastBeat < 5);

/* ---------- file player: play/pause, scrub, repeat, volume ---------- */
const playerEl = document.getElementById('player'), playBtn = document.getElementById('playBtn');
const seekEl = document.getElementById('seek'), volEl = document.getElementById('vol');
const tCur = document.getElementById('tCur'), tDur = document.getElementById('tDur');
const repeatBtn = document.getElementById('repeatBtn'), muteBtn = document.getElementById('muteBtn');
const ICONS = { play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm12.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm11.6 3 2.7-2.7 1.1 1.1-2.7 2.7 2.7 2.7-1.1 1.1-2.7-2.7-2.7 2.7-1.1-1.1 2.7-2.7-2.7-2.7 1.1-1.1z"/></svg>' };
let repeatOn = true, muted = false, scrubbing = false;
const fmt = (x) => !isFinite(x) ? '0:00' : `${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
const fill = (el) => el.style.setProperty('--p', (100*(el.value-el.min)/(el.max-el.min)).toFixed(2)+'%');
function playerVolume(){ return muted ? 0 : +volEl.value; }
function applyVolume(){
  if(A.gain) A.gain.gain.setTargetAtTime(playerVolume(), A.ctx.currentTime, .03);
  muteBtn.innerHTML = muted || +volEl.value === 0 ? ICONS.mute : ICONS.vol;
  muteBtn.classList.toggle('on', muted); fill(volEl);
}
function showPlayer(on){ playerEl.hidden = !on; document.body.classList.toggle('has-player', on); }
function syncPlay(){ playBtn.innerHTML = A.el && !A.el.paused ? ICONS.pause : ICONS.play; }
function syncTime(){
  const el = A.el; if(!el) return;
  if(!scrubbing){ seekEl.value = el.duration ? Math.round(1000*el.currentTime/el.duration) : 0; tCur.textContent = fmt(el.currentTime); }
  tDur.textContent = fmt(el.duration); fill(seekEl);
}
function bindPlayer(el, name){
  document.getElementById('trackName').textContent = name; document.getElementById('trackName').title = name;
  ['play','pause','ended'].forEach(ev => el.addEventListener(ev, syncPlay));
  ['timeupdate','loadedmetadata','durationchange'].forEach(ev => el.addEventListener(ev, syncTime));
  el.addEventListener('seeking', () => { A.skipUntil = now() + .3; });
  showPlayer(true); syncPlay(); syncTime(); applyVolume();
}
function togglePlay(){ if(!A.el) return; ensureCtx(); A.el.paused ? A.el.play() : A.el.pause(); }
playBtn.onclick = togglePlay;
seekEl.addEventListener('input', () => { scrubbing = true; fill(seekEl);
  if(A.el?.duration) tCur.textContent = fmt(seekEl.value/1000*A.el.duration); });
seekEl.addEventListener('change', () => { scrubbing = false;
  if(A.el?.duration){ A.skipUntil = now() + .3; A.el.currentTime = seekEl.value/1000*A.el.duration; } });
repeatBtn.onclick = () => { repeatOn = !repeatOn; repeatBtn.classList.toggle('on', repeatOn); if(A.el) A.el.loop = repeatOn; };
volEl.addEventListener('input', () => { if(+volEl.value > 0) muted = false; applyVolume(); });
muteBtn.onclick = () => { muted = !muted; applyVolume(); };
fill(volEl);

addEventListener('keydown', e => {
  if(e.target.tagName === 'SELECT' || e.target.type === 'range') return;
  if(A.el && (e.key==='p' || e.key==='P')){ togglePlay(); return; }
  if(A.el && (e.key==='m' || e.key==='M')){ muted = !muted; applyVolume(); return; }
  if(e.key==='ArrowRight') goTo((target ?? cur)+1);
  else if(e.key==='ArrowLeft') goTo((target ?? cur)-1);
  else if(e.key===' '){ e.preventDefault(); setLoop(!loop); }
  else if(e.key==='t' || e.key==='T') tap();
});
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 7000);

// JS mirror of the GLSL palette, to tint the light beams
const PAL = [[.10,.32,1],[.58,.18,1],[1,.18,.66],[.12,1,.58]];
function palJS(t, out){ t=(t%1+1)%1*4; const i=Math.floor(t)%4, f=t-Math.floor(t), s=f*f*(3-2*f);
  const a=PAL[i], b=PAL[(i+1)%4]; return out.setRGB(a[0]+(b[0]-a[0])*s, a[1]+(b[1]-a[1])*s, a[2]+(b[2]-a[2])*s); }

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let first = true, perfFrames = 0, perfTime = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1);
  analyse(dt);
  // the show breathes with the music: louder passages run a little faster
  const speed = 1 + U.uAudio.value * THREE.MathUtils.clamp((A.level - .45) * .9, -.4, .55);
  U.uTime.value += dt * speed;
  const driving = musicDriving();
  if(target!==null){
    fadeT += dt; const k = Math.min(fadeT/FADE, 1);
    U.uMix.value = k*k*(3-2*k);
    if(k>=1){ cur = target; target = null; U.uA.value = cur; U.uMix.value = 0; holdT = 0; }
  } else if(!loop && !driving){
    holdT += dt; if(holdT >= HOLD) goTo(cur+1);
  }
  const prog = target!==null ? 0 : driving ? (A.beats % BEATS_PER_LOOK)/BEATS_PER_LOOK : Math.min(holdT/HOLD,1);
  seqBar.style.width = (target!==null ? 0 : prog*100) + '%';

  beams.forEach((b,i) => palJS(U.uTime.value*.05 + i*.35, b.material.uniforms.uColor.value));
  updateDock();
  controls.update();
  renderer.setRenderTarget(rt); renderer.render(rtScene, rtCam); renderer.setRenderTarget(null);
  composer.render();
  // adaptive resolution: step down if the frame rate stays low
  perfFrames++; perfTime += dt;
  if(perfTime > 2.5){
    const fps = perfFrames/perfTime; perfFrames = 0; perfTime = 0;
    if(fps < 42 && pixelRatio > .75){ pixelRatio = Math.max(.75, pixelRatio-.25); renderer.setPixelRatio(pixelRatio); composer.setPixelRatio(pixelRatio); }
  }
  if(first){ first=false; const l=document.getElementById('loader'); l.style.opacity=0; setTimeout(()=>l.remove(),900); }
});
</script>
</body>
